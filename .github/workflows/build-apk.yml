name: Build Offline APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          test -f "BlockManager-APK-CompilerProject-v1.0.0.zip"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -q "BlockManager-APK-CompilerProject-v1.0.0.zip" -d extracted
          test -f extracted/android-studio-project/app/build.gradle
          test -f extracted/android-studio-project/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: extracted/android-studio-project
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockManager-Offline-APK
          path: extracted/android-studio-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error